<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>讲好 · 正文分层试验</title>
    <style>
      __FONT_CSS__
    </style>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #292b29;
        background: #f3f2ee;
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
        background: #fff;
        border: 1px solid #d8d6ce;
        border-radius: 7px;
        padding: 9px 14px;
        color: inherit;
      }
      button:hover {
        background: #ecebe5;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #af422e;
        outline-offset: 3px;
      }
      button[aria-pressed="true"] {
        background: #282d2a;
        color: white;
        border-color: #282d2a;
      }
      header {
        max-width: 1520px;
        margin: auto;
        padding: 28px 30px 20px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: center;
      }
      .brand {
        font-size: 22px;
        font-weight: 650;
      }
      .brand small {
        font-size: 13px;
        font-weight: 400;
        color: #72766c;
        margin-left: 14px;
      }
      .intro {
        margin: 3px 0 0;
        color: #6d7268;
        font-size: 13px;
      }
      main {
        max-width: 1520px;
        padding: 0 30px 40px;
        margin: auto;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 292px;
        gap: 24px;
        align-items: start;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .frame {
        width: 100%;
        aspect-ratio: __WIDTH__/__HEIGHT__;
        position: relative;
        overflow: hidden;
        background: #e7dcc7;
        border-radius: 3px;
        box-shadow: 0 8px 28px #20201516;
      }
      .canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: __WIDTH__px;
        height: __HEIGHT__px;
        transform-origin: 0 0;
      }
      .canvas > img {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
      }
      .text-layer {
        position: absolute;
        transform-origin: 0 0;
        white-space: pre;
        line-height: 1;
        cursor: text;
        outline: 0;
        border: 0;
        padding: 0;
        min-width: 4px;
      }
      .text-layer:hover {
        outline: 1px dashed #ad442e;
      }
      .text-layer:focus {
        outline: 2px solid #ad442e;
      }
      .text-layer.over {
        outline: 3px solid #c03024;
      }
      .original {
        pointer-events: none;
        display: none;
      }
      .frame[data-mode="original"] .original {
        display: block;
      }
      .frame[data-mode="background"] .text-layer {
        visibility: hidden;
      }
      .frame[data-mode="compare"] .original {
        display: block;
        clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0);
      }
      .divider {
        display: none;
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--split, 50%);
        width: 2px;
        background: #fff;
        box-shadow: 0 0 4px #333;
        pointer-events: none;
      }
      .frame[data-mode="compare"] .divider {
        display: block;
      }
      .compare-control {
        margin: 14px 0;
        display: none;
      }
      .compare-control.visible {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .compare-control input {
        flex: 1;
        min-width: 0;
        accent-color: #ad442e;
      }
      .caption {
        color: #6c7068;
        font-size: 13px;
        margin: 14px 0;
      }
      .caption strong {
        color: #3b433b;
        font-weight: 500;
      }
      aside {
        padding-top: 0;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      aside p {
        font-size: 13px;
        color: #6d7268;
        margin: 0 0 20px;
      }
      .field {
        display: block;
        font-size: 12px;
        color: #74796e;
        margin: 15px 0;
      }
      .field textarea {
        display: block;
        width: 100%;
        margin-top: 7px;
        resize: vertical;
        min-height: 62px;
        border: 1px solid #d9d8d0;
        border-radius: 7px;
        padding: 10px 11px;
        color: #35392f;
        background: #fff;
        font-size: 14px;
        line-height: 1.6;
      }
      .field textarea:focus {
        outline: 2px solid #ad442e;
        border-color: transparent;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-top: 1px solid #ddddd3;
        padding-top: 18px;
        margin-top: 20px;
      }
      .actions button {
        font-size: 13px;
      }
      .status {
        min-height: 42px;
        margin-top: 14px;
        color: #757b6e;
        font-size: 12px;
      }
      .status.error {
        color: #a23a2e;
      }
      .foot {
        margin: 22px 0 0;
        border-top: 1px solid #dddcd4;
        padding-top: 16px;
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
        color: #6d7268;
        font-size: 12px;
      }
      a {
        color: #963e2b;
        text-underline-offset: 3px;
      }
      .mode-note {
        margin-top: 8px;
        font-size: 12px;
        color: #7a7d73;
      }
      #fullscreen {
        font-size: 13px;
      }
      .frame:fullscreen {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        background: #161a17;
      }
      .frame:fullscreen .canvas {
        left: 50%;
        top: 50%;
        transform-origin: 50% 50%;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        aside {
          border-top: 1px solid #d8d7d0;
          padding-top: 20px;
        }
        .fields {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 18px;
        }
        .field {
          margin: 8px 0;
        }
        header,
        main {
          padding-left: 18px;
          padding-right: 18px;
        }
      }
      @media (max-width: 520px) {
        .brand small {
          display: block;
          margin-left: 0;
        }
        .fields {
          grid-template-columns: 1fr;
        }
        header {
          padding-top: 20px;
        }
        .toolbar {
          gap: 5px;
        }
        .toolbar button {
          padding: 9px 10px;
          font-size: 13px;
        }
        #fullscreen {
          padding: 9px;
          font-size: 12px;
        }
        .foot {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand">讲好 <small>正文分层 · 单页试验</small></div>
        <p class="intro">《朝花夕拾》 · 先讲故事</p>
      </div>
      <button id="fullscreen">全屏看效果</button>
    </header>
    <main>
      <div class="layout">
        <section aria-label="原图与分层效果对照">
          <div class="toolbar" aria-label="显示方式">
            <button data-mode="edited" aria-pressed="true">分层效果</button
            ><button data-mode="original" aria-pressed="false">原图</button
            ><button data-mode="background" aria-pressed="false">
              只看底图</button
            ><button data-mode="compare" aria-pressed="false">拖动对照</button>
          </div>
          <div class="frame" data-mode="edited" id="frame">
            <div class="canvas" id="canvas">
              <img id="background" alt="保留原构图、艺术字和装饰的去正文底图" />
              <div id="texts"></div>
              <img class="original" id="original" alt="修改前的整页图片" />
            </div>
            <div class="divider"></div>
          </div>
          <div class="compare-control">
            <span>原图</span
            ><input
              id="compare"
              type="range"
              min="0"
              max="100"
              value="50"
              aria-label="原图与分层效果分界"
            /><span>分层效果</span>
          </div>
          <p class="caption">
            <strong>点击画面中的正文，或在右侧修改。</strong
            >艺术标题、插画与装饰保留在底图。
          </p>
          <p class="mode-note">
            原字号、行位与颜色固定；修改超长文字时会提示，不会悄悄缩字挤进原版式。
          </p>
        </section>
        <aside>
          <h1>试着改一句话</h1>
          <p>3 行正文拆成 4 个文字层，黑字和红字可分别修改。</p>
          <div class="fields" id="fields"></div>
          <div class="actions">
            <button id="sample">试改“一分钟”</button
            ><button id="reset">恢复原文</button
            ><button id="save">保存修改版 HTML</button>
          </div>
          <div id="status" class="status" aria-live="polite">
            编辑只发生在这个试验页。
          </div>
        </aside>
      </div>
      <footer class="foot">
        <span>局部去字 + 独立文字层 · 单页手工校准样例</span
        ><span>底图只替换正文笔画附近；替换区域之外逐像素保留原图。</span
        ><span
          ><a href="editable-text.pptx" id="pptx">下载原文分层 PPTX</a
          >（不会同步当前网页的修改）</span
        >
      </footer>
    </main>
    <script id="deck-data" type="application/json">
      __DECK__
    </script>
    <script>
      __SCRIPT__;
    </script>
  </body>
</html>
