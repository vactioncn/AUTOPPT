<!doctype html>
<html lang="zh-CN" data-theme="swiss">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ · H5 演讲试验</title>
  <style>__FONTS__</style>
  <style>__CSS__</style>
</head>
<body>
  <header class="toolbar">
    <div class="lab-name">演讲预览 <small>__TITLE__</small></div>
    <label class="theme-field">模板
      <select id="theme" aria-label="选择视觉模板">
        <option value="swiss">当代 Neo-Swiss</option>
        <option value="architecture">日系现代建筑提案风</option>
      </select>
    </label>
    <div class="tools">
      <button id="overview">目录</button><button id="notes">讲稿与来源</button>
      <button id="phone" aria-pressed="false">手机预览</button>
      <button id="fullscreen">全屏</button><button id="present">开始演讲</button>
    </div>
  </header>
  <main class="workspace">
    <div class="viewport" id="viewport" aria-label="演讲画面">
      <div class="stage" id="stage"></div>
    </div>
  </main>
  <footer class="controls">
    <div class="position"><b id="page-number"></b><span id="page-title"></span></div>
    <div class="step-progress" id="step-progress" aria-label="本页讲述步骤"></div>
    <div class="navigation"><button id="previous" aria-label="上一步">←</button><span id="step-number" aria-live="polite"></span><button id="next">下一步 →</button></div>
    <div class="total-progress"><div id="total-progress"></div></div>
  </footer>
  <button id="exit-present" hidden>退出演讲 · Esc</button>
  <dialog id="detail" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">关闭 ×</button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="blackout" hidden><span>按 B 或 Esc 返回演讲</span></div>
  <div class="sr-only" id="live-status" role="status"></div>
  <script id="deck-data" type="application/json">__DATA__</script>
  <script>__JS__</script>
</body>
</html>
